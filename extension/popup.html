<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nova</title>
<style>
  :root { --ink: #0d0c10; --paper: #ece8e1; --dim: #8d8894; --coral: #ff8a65; --violet: #7c5cff; --line: #26232c; }
  body { margin: 0; width: 280px; padding: 16px; background: var(--ink); color: var(--paper);
         font: 13px/1.45 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font: 600 18px Georgia, serif; }
  #status { margin: 0 0 14px; color: var(--dim); }
  #status b { color: var(--coral); font-weight: 600; }
  #status.connected b { color: var(--violet); }
  label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 12px; }
  input { box-sizing: border-box; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
          background: #16141b; color: var(--paper); font: 12px ui-monospace, Consolas, monospace; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; padding: 7px; border: 0; border-radius: 6px; cursor: pointer; font: 600 12px system-ui, sans-serif; }
  #save { background: var(--violet); color: #fff; }
  #reconnect { background: #26232c; color: var(--paper); }
  p.hint { margin: 12px 0 0; color: var(--dim); font-size: 11.5px; }
</style>
</head>
<body>
  <h1>Nova</h1>
  <p id="status">…</p>
  <label for="port">Nova's port</label>
  <input id="port" type="number" min="1" max="65535">
  <label for="token">Token (leave empty to use the canvas cookie)</label>
  <input id="token" type="password" autocomplete="off" placeholder="from data/nova_token">
  <div class="row"><button id="save">Save</button><button id="reconnect">Reconnect</button></div>
  <p class="hint">Opening the Nova canvas in this Chrome once pairs the extension. Nothing else can send it commands.</p>
  <script src="popup.js"></script>
</body>
</html>
