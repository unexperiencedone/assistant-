name = "Play something on Spotify"
description = "Searches Spotify for {query}, plays the result that best matches it, and says what is actually playing. For a genre or a mood, say \"play some {query}\" instead."
phrases = [
  "play {query} on spotify",
  "play the song {query} on spotify",
  "put on {query}",
  "play the song {query}",
  "play {query}",
  "put on {query} on spotify",
  "spotify play {query}",
  "search spotify for {query}",
  "play {query} in spotify",
]

[[steps]]
do = "open"
label = "Search Spotify for {query}"
target = "spotify:search:{query_url}"

[[steps]]
do = "wait_window"
title = "exe:spotify"
timeout = 25

# What Spotify's title says now: "Spotify Premium" when paused, "Artist - Song" when playing.
[[steps]]
do = "title"
window = "exe:spotify"
save_as = "before"
optional = true

# Proof the results on screen are for *this* search: Spotify sometimes ignores the link
# when it is already open and keeps the last search ("tera didarva" was looked for in the
# results for "didarwa", and failed). The box holds the query; the link is re-sent once.
[[steps]]
do = "wait_value"
label = "Check Spotify is showing the search for {query}"
window = "exe:spotify"
name = "What do you want to play?"
contains = "{query}"
reopen = "spotify:search:{query_url}"
timeout = 8

# Let the results under that box finish replacing the last ones.
[[steps]]
do = "wait"
seconds = 1.5

# Results are buttons named "Play <title>", in Spotify's own order. The bare "Play" is the
# player bar and " • " names are the library sidebar, so neither can win. A spoken name is
# spelt loosely ("didarva" for "didarwa"), so close spellings count; if nothing matches,
# Spotify's top result is its best guess at what was heard, and the next step says
# exactly what started, so a wrong guess is obvious and easy to correct.
[[steps]]
do = "click_best"
label = "Play the best match for {query}"
window = "exe:spotify"
query = "{query}"
prefix = "Play "
control_type = "Button"
exclude = " • "
fallback_first = true
timeout = 6

# Done means the title changed to a track, not that a click went through.
[[steps]]
do = "wait_title"
label = "Check it is playing"
window = "exe:spotify"
changed_from = "{before}"
ignore = "^Spotify( Premium| Free)?$"
save_as = "playing"
timeout = 8

[[steps]]
do = "say"
text = "Playing {playing}."
